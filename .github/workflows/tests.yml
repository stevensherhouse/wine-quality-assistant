name: Test and train
on:
  push:
    paths-ignore: ['docs/**', 'reports/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'reports/**', 'README.md']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.train --download
      - run: pytest tests/ -v --junitxml=reports/ci-tests.xml
      - run: python -m src.demo
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-and-test-reports
          path: reports/
